services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - qa-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qa']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qa-data:
